services:
  selenium:
    image: selenium/standalone-chrome:4.25.0
    shm_size: "2gb"
    environment:
      - SE_NODE_MAX_SESSIONS=1
      - SE_START_XVFB=true
    ports:
      - "4444:4444"
      # optional VNC for live viewing: the password is: "secret"
      - "5900:5900"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:4444/status | grep -q '\"ready\": true'"]
      interval: 2s
      timeout: 2s
      retries: 60

  robot:
    build: .
    depends_on:
      selenium:
        condition: service_healthy     # ← wait until the Grid is ready
    working_dir: /project
    environment:
      - TZ=Africa/Cairo
    volumes:
      - ./:/project
    command: >
      robot
      -d results
      -v BROWSER:chrome
      -v BASE_URL:https://demo.prestashop.com/
      -v REMOTE_URL:http://selenium:4444/wd/hub
      tests
